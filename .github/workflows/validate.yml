name: validate

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/references/**"
      - "**/evals/**"
      - ".github/scripts/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [master]
    paths:
      - "**/SKILL.md"
      - "**/references/**"
      - "**/evals/**"
      - ".github/scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Validate package structure, frontmatter, size limits,
      # and local reference paths.
      - name: Validate skill packages
        run: node .github/scripts/validate-skills.mjs

      # The validator is regex over prose; prove it still catches what it
      # claims to before trusting a green run.
      - name: Test the validator
        run: node --test .github/scripts/validate-skills.test.mjs

      # Verify that each skill can be installed through the official CLI.
      - name: Test skill install
        run: |
          set -euo pipefail
          shopt -s nullglob

          skill_files=(*/SKILL.md)

          if ((${#skill_files[@]} == 0)); then
            echo "::error::No root-level skill packages found"
            exit 1
          fi

          for skill_md in "${skill_files[@]}"; do
            skill="${skill_md%/SKILL.md}"

            npx --yes skills@1.5.20 add "$GITHUB_WORKSPACE" \
              --skill "$skill" \
              --agent universal \
              --copy \
              --global \
              --yes

            # The CLI picks the install root itself, so probe the known
            # locations rather than asserting one of them.
            install_path=""

            for candidate in "$HOME/.agents/skills/$skill" \
                             "$HOME/.config/agents/skills/$skill"; do
              if [ -f "$candidate/SKILL.md" ]; then
                install_path="$candidate"
                break
              fi
            done

            if [ -z "$install_path" ]; then
              echo "::error::$skill was not installed under" \
                   "$HOME/.agents/skills or $HOME/.config/agents/skills"
              exit 1
            fi

            if [ -d "$skill/references" ] &&
               [ ! -d "$install_path/references" ]; then
              echo "::error::$skill references/ directory was not installed"
              exit 1
            fi

            echo "$skill installed and verified at $install_path"
          done
